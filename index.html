<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stumble Fight 3D - Test Map</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .hud-card { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); border: 2px solid rgba(255, 255, 255, 0.2); padding: 10px 20px; border-radius: 12px; color: white; font-weight: bold; font-size: 18px; }
        #menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(30,30,60,0.95) 0%, rgba(10,10,20,0.98) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; transition: opacity 0.3s ease; }
        h1 { color: #ffcc00; font-size: 4rem; margin: 0 0 10px 0; text-align: center; }
        p.subtitle { color: #a0a0c0; font-size: 1.2rem; margin-bottom: 30px; text-align: center; }
        .btn { background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%); color: white; border: none; padding: 15px 40px; font-size: 1.5rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 25px rgba(255, 107, 107, 0.5); }
        #controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; pointer-events: none; }
        .touch-group { display: flex; gap: 15px; pointer-events: auto; }
        .control-btn { width: 75px; height: 75px; background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #virtual-joystick { width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; position: relative; pointer-events: auto; touch-action: none; }
        #joystick-knob { width: 50px; height: 50px; background: rgba(255, 255, 255, 0.6); border-radius: 50%; position: absolute; top: 35px; left: 35px; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div class="hud-top">
            <div class="hud-card" id="score-hud">Checkpoint : 1 / 5</div>
            <div class="hud-card" id="status-hud">Tirer : Touche F | Dash : Saut en l'air</div>
        </div>
        <div id="controls">
            <div id="virtual-joystick"><div id="joystick-knob"></div></div>
            <div class="touch-group">
                <div class="control-btn" id="btn-shoot">💥</div>
                <div class="control-btn" id="btn-jump">⬆️</div>
            </div>
        </div>
    </div>
    <div id="menu-screen">
        <h1>STUMBLE FIGHT</h1>
        <p class="subtitle">Chargement du joueur...</p>
        <button class="btn" id="start-btn" disabled>CHARGEMENT...</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111125);
        scene.fog = new THREE.FogExp2(0x111125, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 30, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- CONSTRUCTION DE LA MAP DE SECOURS (Style Glacé) ---
        const platforms = [];
        const hazards = [];
        const checkpoints = [];

        function createPlatform(x, y, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.3 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            scene.add(mesh);
            platforms.push({ mesh, bounds: { x, z, w, d, y } });
        }

        function createCheckpoint(x, y, z) {
            const ringGeo = new THREE.TorusGeometry(1.5, 0.15, 16, 32);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00aa88 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.set(x, y + 1.5, z);
            ring.rotation.y = Math.PI / 2;
            scene.add(ring);
            checkpoints.push({ x, z, mesh: ring });
        }

        // Map de test structurée
        createPlatform(0, -0.5, 0, 10, 1, 20, 0xaaddff);
        createCheckpoint(0, 0, -10);
        createPlatform(0, -0.5, -30, 8, 1, 30, 0x88ccff);
        createCheckpoint(0, 0, -45);
        createPlatform(0, -0.5, -70, 12, 1, 25, 0x66bbff);

        // --- CHARGEMENT DU JOUEUR ---
        let playerMesh = null;
        let playerLoaded = false;
        const player = { x: 0, y: 0, z: 5, vx: 0, vy: 0, vz: 0, speed: 0.15, isGrounded: false, hasDashed: false, checkpointIndex: 0 };
        const bots = [];
        const bullets = [];

        const gltfLoader = new THREE.GLTFLoader();
        gltfLoader.load('crash_test_dummy.glb', function (gltf) {
            playerMesh = gltf.scene;
            playerMesh.scale.set(1, 1, 1);
            playerMesh.traverse((node) => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });
            scene.add(playerMesh);
            playerLoaded = true;
            document.getElementById('start-btn').innerText = "JOUER";
            document.getElementById('start-btn').disabled = false;
            document.querySelector('p.subtitle').innerText = "Prêt à jouer !";
        }, undefined, function (error) {
            console.error(error);
            document.querySelector('p.subtitle').innerText = "Erreur chargement crash_test_dummy.glb";
        });

        // Contrôles basiques pour tester
        const keys = { forward: false, backward: false, left: false, right: false };
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.forward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.backward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'Space') { if (player.isGrounded) { player.vy = 0.22; player.isGrounded = false; } }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.forward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.backward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
        });

        let gameStarted = false;
        document.getElementById('start-btn').addEventListener('click', () => {
            if (!playerLoaded) return;
            document.getElementById('menu-screen').style.opacity = '0';
            setTimeout(() => { document.getElementById('menu-screen').style.display = 'none'; gameStarted = true; }, 300);
        });

        function updatePhysics() {
            if (!gameStarted || !playerMesh) return;
            let moveX = 0, moveZ = 0;
            if (keys.forward) moveZ = -1;
            if (keys.backward) moveZ = 1;
            if (keys.left) moveX = -1;
            if (keys.right) moveX = 1;

            player.vx = moveX * player.speed;
            player.vz = moveZ * player.speed;
            player.x += player.vx;
            player.z += player.vz;
            player.vy -= 0.012;
            player.y += player.vy;

            player.isGrounded = false;
            platforms.forEach(p => {
                const b = p.bounds;
                if (Math.abs(player.x - b.x) < b.w / 2 && Math.abs(player.z - b.z) < b.d / 2) {
                    if (player.y <= b.y + 0.5 && player.y >= b.y - 0.2 && player.vy <= 0) {
                        player.y = b.y + 0.5;
                        player.vy = 0;
                        player.isGrounded = true;
                    }
                }
            });

            if (player.y < -10) { player.x = 0; player.z = 5; player.y = 2; player.vy = 0; }

            playerMesh.position.set(player.x, player.y, player.z);
            if (Math.abs(player.vx) > 0.01 || Math.abs(player.vz) > 0.01) {
                playerMesh.rotation.y = Math.atan2(player.vx, player.vz);
            }

            camera.position.set(player.x, player.y + 5, player.z + 8);
            camera.lookAt(player.x, player.y + 1, player.z);
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>

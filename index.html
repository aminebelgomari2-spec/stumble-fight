<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stumble Fight 3D - Icy Heights</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(30,30,60,0.95) 0%, rgba(10,10,20,0.98) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        h1 {
            color: #ffcc00;
            font-size: 4rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6), 0 5px 0 #cc9900;
            text-align: center;
            letter-spacing: 2px;
        }
        p.subtitle {
            color: #a0a0c0;
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-align: center;
        }
        .btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.5);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-top: 10px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        #controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            pointer-events: none;
        }
        .touch-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .control-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        #virtual-joystick {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }
        #joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            position: absolute;
            top: 35px;
            left: 35px;
            pointer-events: none;
            transition: transform 0.05s linear;
        }
    </style>
    <!-- Three.js et GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- PeerJS : WebRTC peer-to-peer avec mise en relation gratuite (aucun serveur perso requis) -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="hud-card" id="score-hud">Checkpoint : 1 / 5</div>
            <div class="hud-card" id="status-hud">Tirer : Touche F | Dash : Saut en l'air</div>
        </div>
        
        <div id="controls">
            <div id="virtual-joystick">
                <div id="joystick-knob"></div>
            </div>
            <div class="touch-group">
                <div class="control-btn" id="btn-shoot">💥</div>
                <div class="control-btn" id="btn-jump">⬆️</div>
            </div>
        </div>
    </div>

    <div id="menu-screen">
        <h1>STUMBLE FIGHT</h1>
        <p class="subtitle" id="loading-subtitle">Chargement de votre Crash Test Dummy 3D...</p>

        <div id="mp-choice" style="display:none; flex-direction:column; align-items:center; gap:12px;">
            <div style="display:flex; gap:15px;">
                <button class="btn" id="create-room-btn" style="background:linear-gradient(135deg,#4facfe,#00f2fe); font-size:1.1rem; padding:12px 28px;">CRÉER UN SALON</button>
                <button class="btn" id="join-room-btn" style="background:linear-gradient(135deg,#a18cd1,#fbc2eb); font-size:1.1rem; padding:12px 28px;">REJOINDRE UN SALON</button>
            </div>
            <button class="btn" id="start-btn" style="margin-top:5px;">JOUER EN SOLO</button>
        </div>

        <!-- Formulaire pour entrer le code du salon à rejoindre -->
        <div id="join-form" style="display:none; flex-direction:column; align-items:center; gap:10px;">
            <p class="subtitle" style="margin-bottom:5px;">Entre le code du salon :</p>
            <input type="text" id="room-code-input" placeholder="Code du salon" maxlength="8" style="padding:12px 18px; font-size:1.1rem; border-radius:30px; border:2px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.4); color:white; text-align:center; width:220px; text-transform:uppercase; letter-spacing:3px;">
            <button class="btn" id="confirm-join-btn">REJOINDRE</button>
        </div>

        <!-- Salle d'attente (hôte et invités) -->
        <div id="lobby" style="display:none; flex-direction:column; align-items:center; gap:10px;">
            <p class="subtitle" id="lobby-code-text"></p>
            <p class="subtitle" id="lobby-count-text">Joueurs dans le salon : 1</p>
            <button class="btn" id="launch-race-btn" style="display:none;">LANCER LA PARTIE</button>
            <p class="subtitle" id="lobby-wait-text" style="display:none;">En attente que l'hôte lance la partie...</p>
        </div>
    </div>

    <script>
        // --- SCÈNE & MOTEUR 3D ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111125);
        scene.fog = new THREE.FogExp2(0x111125, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- ÉCLAIRAGE OPTIMISÉ ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 30, 15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x88bbff, 0.4);
        fillLight.position.set(-20, 20, -20);
        scene.add(fillLight);

        // --- DESIGN DE LA MAP CODÉE EN DUR (plateformes de secours) ---
        const platforms = [];
        const hazards = [];
        const checkpoints = [];

        function buildMap() {
            createPlatform(0, -0.5, 0, 10, 1, 15, 0xaaddff);
            createPlatform(0, -0.5, -20, 8, 1, 20, 0x88ccff);
            createPlatform(0, -0.5, -45, 10, 1, 25, 0x66bbff);
            createRotator(0, 0, -45);
            createPlatform(0, -0.5, -75, 4, 1, 20, 0x7799ff);
            createPlatform(-3, -0.5, -95, 4, 1, 15, 0x7799ff);
            createPlatform(3, -0.5, -115, 4, 1, 15, 0x7799ff);
            createPlatform(0, -0.5, -145, 12, 1, 20, 0x00aa66);
        }

        function createPlatform(x, y, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.2 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            scene.add(mesh);
            platforms.push({ mesh, bounds: { x, z, w, d, y } });
        }

        function createCheckpoint(x, y, z, isFinish = false) {
            const ringGeo = new THREE.TorusGeometry(1.5, 0.15, 16, 32);
            const color = isFinish ? 0xffcc00 : 0x00ffcc;
            const emissive = isFinish ? 0xaa8800 : 0x00aa88;
            const ringMat = new THREE.MeshStandardMaterial({ color: color, emissive: emissive });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.set(x, y + 1.5, z);
            ring.rotation.y = Math.PI / 2;
            scene.add(ring);
            checkpoints.push({ x, z, mesh: ring, isFinish });
        }

        // --- VRAI PARCOURS (coordonnées relevées sur la map avec les outils admin G/H/J) ---
        const COURSE_SPAWN = { x: -29.27, y: -9.26, z: 302.18 };
        const COURSE_CHECKPOINTS = [
            { x: -24.15, y: -16.83, z: 144.98 },
            { x: 4.18, y: -2.52, z: 80.04 },
            { x: 6.77, y: -2.48, z: -5.09 },
            { x: 5.98, y: -64.26, z: -227.77 }
        ];
        const COURSE_FINISH = { x: 5.81, y: -58.53, z: -301.97 };
        let raceFinished = false;

        function buildRealCourse() {
            COURSE_CHECKPOINTS.forEach(cp => createCheckpoint(cp.x, cp.y, cp.z));
            createCheckpoint(COURSE_FINISH.x, COURSE_FINISH.y, COURSE_FINISH.z, true);
        }

        function createRotator(x, y, z) {
            const pivot = new THREE.Group();
            pivot.position.set(x, y + 0.5, z);
            scene.add(pivot);
            const armGeo = new THREE.BoxGeometry(8, 0.4, 0.8);
            const armMat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
            const arm = new THREE.Mesh(armGeo, armMat);
            arm.position.x = 4;
            arm.castShadow = true;
            pivot.add(arm);
            hazards.push({ pivot, speed: 0.04 });
        }

        // buildMap(); // Plateformes de secours désactivées : on utilise uniquement le vrai parcours sur la map
        buildRealCourse();

        // --- CHARGEMENT DU MODÈLE GLB JOUEUR & BOTS ---
        const loader = new THREE.GLTFLoader();
        let playerMesh = null;
        const player = {
            x: COURSE_SPAWN.x, y: COURSE_SPAWN.y, z: COURSE_SPAWN.z,
            vx: 0, vy: 0, vz: 0,
            dashVx: 0, dashVz: 0,
            facingAngle: 0,
            speed: 0.15,
            isGrounded: false,
            hasDashed: false,
            checkpointIndex: 0
        };

        const bots = [];
        const bullets = [];

        // Raycaster utilisé chaque frame pour détecter le sol de la map GLB
        // (les plateformes codées en dur utilisent leur propre système de bounds)
        const groundRaycaster = new THREE.Raycaster();
        const DOWN_VECTOR = new THREE.Vector3(0, -1, 0);

        function shootLaser() {
            const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            const dirX = Math.sin(player.facingAngle);
            const dirZ = Math.cos(player.facingAngle);
            bullet.position.set(player.x + dirX * 0.6, player.y + 1.2, player.z + dirZ * 0.6);
            scene.add(bullet);
            bullets.push({ mesh: bullet, vx: dirX * 0.8, vz: dirZ * 0.8, life: 0 });
        }

        // --- CHARGEMENT DE LA MAP "ICY HEIGHTS" (glb) ---
        let mapMesh = null;
        let mapReady = false;

        loader.load('icy_heights_common_map.glb', function (gltf) {
            mapMesh = gltf.scene;
            mapMesh.traverse((node) => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });

            // Le modèle est exporté avec des coordonnées très éloignées de l'origine
            // (ex: y autour de -1000). On calcule sa bounding box AVANT de l'ajouter
            // à la scène, puis on recentre le mesh sur (0,0,0) en X/Z et on met
            // le sommet de la map à y=0, pour que ça coïncide avec le reste du jeu.
            const rawBox = new THREE.Box3().setFromObject(mapMesh);
            const rawCenter = rawBox.getCenter(new THREE.Vector3());
            const rawTopY = rawBox.max.y;

            mapMesh.position.x -= rawCenter.x;
            mapMesh.position.z -= rawCenter.z;
            mapMesh.position.y -= rawTopY;

            // Décalage supplémentaire pour pousser la map vers la gauche et un peu vers le haut.
            const MAP_EXTRA_OFFSET_X = -25;
            const MAP_EXTRA_OFFSET_Y = 20;
            mapMesh.position.x += MAP_EXTRA_OFFSET_X;
            mapMesh.position.y += MAP_EXTRA_OFFSET_Y;

            scene.add(mapMesh);

            // Bounding box recalculée après recentrage (pour vérif dans la console)
            const box = new THREE.Box3().setFromObject(mapMesh);
            console.log('Map bounding box (recentrée):', box.min, box.max);

            mapReady = true;
        }, undefined, function (error) {
            console.error('Erreur chargement map GLB:', error);
            document.getElementById('loading-subtitle').innerText = "Erreur : Vérifiez que 'icy_heights_common_map.glb' est bien à la racine.";
        });

        loader.load('crash_test_dummy.glb', function (gltf) {
            playerMesh = gltf.scene;
            playerMesh.scale.set(1, 1, 1);
            playerMesh.traverse((node) => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                    if (node.material) {
                        node.material.roughness = 0.4;
                        node.material.metalness = 0.1;
                    }
                }
            });
            scene.add(playerMesh);

            for (let i = 0; i < 3; i++) {
                const botClone = gltf.scene.clone();
                botClone.scale.set(1, 1, 1);
                scene.add(botClone);
                bots.push({
                    mesh: botClone,
                    x: (i - 1) * 2,
                    y: 0,
                    z: - (i * 10),
                    speed: 0.06 + Math.random() * 0.02
                });
            }

            document.getElementById('loading-subtitle').innerText = "Modèle chargé ! Choisis un mode de jeu :";
            document.getElementById('mp-choice').style.display = 'flex';
        }, undefined, function (error) {
            console.error('Erreur chargement GLB:', error);
            document.getElementById('loading-subtitle').innerText = "Erreur : Vérifiez que 'crash_test_dummy.glb' est bien à la racine.";
        });

        // --- CONTRÔLES CLAVIER & TACTILE ---
        const keys = { forward: false, backward: false, left: false, right: false };
        let joystickMove = { x: 0, y: 0 };

        // --- CAMÉRA ORBITALE (on peut tourner la vue autour du joueur) ---
        // Valeurs calibrées pour reproduire exactement l'angle de la caméra
        // d'origine (offset x:0, y:+5, z:+8 par rapport au joueur) à yaw=0.
        let cameraYaw = 0;
        let cameraPitch = 0.5586; // radians
        const CAMERA_DISTANCE = 9.433;
        const CAMERA_MIN_PITCH = 0.15;
        const CAMERA_MAX_PITCH = 1.4;
        const CAMERA_SENSITIVITY = 0.006;

        let isDraggingCamera = false;
        let lastDragX = 0, lastDragY = 0;

        renderer.domElement.addEventListener('mousedown', (e) => {
            isDraggingCamera = true;
            lastDragX = e.clientX;
            lastDragY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDraggingCamera) return;
            const dx = e.clientX - lastDragX;
            const dy = e.clientY - lastDragY;
            lastDragX = e.clientX;
            lastDragY = e.clientY;
            cameraYaw -= dx * CAMERA_SENSITIVITY;
            cameraPitch = Math.min(CAMERA_MAX_PITCH, Math.max(CAMERA_MIN_PITCH, cameraPitch - dy * CAMERA_SENSITIVITY));
        });
        window.addEventListener('mouseup', () => { isDraggingCamera = false; });

        // Tactile : un doigt qui n'est pas celui du joystick fait tourner la caméra
        let cameraTouchId = null;
        let lastCamTouchX = 0, lastCamTouchY = 0;

        renderer.domElement.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (cameraTouchId === null && t.identifier !== joystickTouchId) {
                    cameraTouchId = t.identifier;
                    lastCamTouchX = t.clientX;
                    lastCamTouchY = t.clientY;
                }
            }
        });
        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === cameraTouchId) {
                    const dx = t.clientX - lastCamTouchX;
                    const dy = t.clientY - lastCamTouchY;
                    lastCamTouchX = t.clientX;
                    lastCamTouchY = t.clientY;
                    cameraYaw -= dx * CAMERA_SENSITIVITY;
                    cameraPitch = Math.min(CAMERA_MAX_PITCH, Math.max(CAMERA_MIN_PITCH, cameraPitch - dy * CAMERA_SENSITIVITY));
                }
            }
        });
        window.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === cameraTouchId) cameraTouchId = null;
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.forward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.backward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'Space') handleJumpOrDash();
            if (e.code === 'KeyF') shootLaser();
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.forward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.backward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
        });

        function handleJumpOrDash() {
            if (player.isGrounded) {
                player.vy = 0.22;
                player.isGrounded = false;
                player.hasDashed = false;
            } else if (!player.hasDashed) {
                player.vy = 0.05;
                const DASH_STRENGTH = 0.6;
                const dirX = Math.sin(player.facingAngle);
                const dirZ = Math.cos(player.facingAngle);
                player.dashVx += dirX * DASH_STRENGTH;
                player.dashVz += dirZ * DASH_STRENGTH;
                player.hasDashed = true;
            }
        }

        const joystick = document.getElementById('virtual-joystick');
        const knob = document.getElementById('joystick-knob');
        let joystickTouchId = null;
        let joystickCenter = { x: 0, y: 0 };

        joystick.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            const rect = joystick.getBoundingClientRect();
            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        });

        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    let dx = touch.clientX - joystickCenter.x;
                    let dy = touch.clientY - joystickCenter.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = 45;
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    knob.style.transform = `translate(${dx}px, ${dy}px)`;
                    joystickMove.x = dx / maxDist;
                    joystickMove.y = dy / maxDist;
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    joystickTouchId = null;
                    knob.style.transform = `translate(0px, 0px)`;
                    joystickMove.x = 0;
                    joystickMove.y = 0;
                }
            }
        });

        document.getElementById('btn-jump').addEventListener('click', handleJumpOrDash);
        document.getElementById('btn-shoot').addEventListener('click', shootLaser);

        let gameStarted = false;

        function startGame() {
            if (!playerMesh) return;
            document.getElementById('menu-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('menu-screen').style.display = 'none';
                // Tout le monde repart du vrai spawn au lancement de la partie
                player.x = COURSE_SPAWN.x;
                player.y = COURSE_SPAWN.y;
                player.z = COURSE_SPAWN.z;
                player.vx = 0; player.vy = 0; player.vz = 0;
                player.dashVx = 0; player.dashVz = 0;
                player.checkpointIndex = 0;
                gameStarted = true;
            }, 300);
        }

        document.getElementById('start-btn').addEventListener('click', startGame);

        // ==================================================================
        // --- MULTIJOUEUR P2P (WebRTC via PeerJS, aucun serveur perso requis) ---
        // ==================================================================
        let peer = null;                 // Instance PeerJS locale
        let isHost = false;               // true si on a créé le salon
        const hostConnections = new Map(); // (hôte uniquement) peerId -> DataConnection
        let hostConnection = null;        // (invité uniquement) DataConnection vers l'hôte
        const remotePlayers = new Map();   // peerId -> { mesh, x, y, z, rotY }
        let myPeerId = null;

        const mpChoiceEl = document.getElementById('mp-choice');
        const joinFormEl = document.getElementById('join-form');
        const lobbyEl = document.getElementById('lobby');
        const lobbyCodeText = document.getElementById('lobby-code-text');
        const lobbyCountText = document.getElementById('lobby-count-text');
        const launchRaceBtn = document.getElementById('launch-race-btn');
        const lobbyWaitText = document.getElementById('lobby-wait-text');

        function showLobby() {
            mpChoiceEl.style.display = 'none';
            joinFormEl.style.display = 'none';
            lobbyEl.style.display = 'flex';
        }

        function updateLobbyCount() {
            const count = hostConnections.size + 1; // +1 = l'hôte lui-même
            lobbyCountText.innerText = `Joueurs dans le salon : ${count}`;
        }

        // Crée ou récupère le mesh d'un joueur distant pour l'afficher dans la scène
        function getOrCreateRemoteMesh(id) {
            if (remotePlayers.has(id)) return remotePlayers.get(id);
            let mesh = null;
            if (playerMesh) {
                mesh = playerMesh.clone();
                scene.add(mesh);
            }
            const entry = { mesh, x: COURSE_SPAWN.x, y: COURSE_SPAWN.y, z: COURSE_SPAWN.z, rotY: 0 };
            remotePlayers.set(id, entry);
            return entry;
        }

        function removeRemotePlayer(id) {
            const entry = remotePlayers.get(id);
            if (entry && entry.mesh) scene.remove(entry.mesh);
            remotePlayers.delete(id);
        }

        // Traite un message reçu (position d'un autre joueur, ou signal de départ)
        function handleIncomingData(data, fromId) {
            if (data.type === 'pos') {
                const entry = getOrCreateRemoteMesh(data.id);
                entry.x = data.x; entry.y = data.y; entry.z = data.z; entry.rotY = data.rotY;
                // Si on est l'hôte, on relaie cette position à tous les autres invités
                if (isHost) {
                    hostConnections.forEach((conn, id) => {
                        if (id !== fromId) conn.send(data);
                    });
                }
            } else if (data.type === 'start') {
                startGame();
            } else if (data.type === 'leave') {
                removeRemotePlayer(data.id);
                if (isHost) {
                    hostConnections.forEach((conn, id) => {
                        if (id !== fromId) conn.send(data);
                    });
                }
            }
        }

        // Génère un code court et facile à taper (évite les caractères ambigus O/0, I/1)
        function generateShortRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 5; i++) {
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            return code;
        }

        // --- CRÉER UN SALON (hôte) ---
        function createRoom(attemptsLeft) {
            const roomCode = generateShortRoomCode();
            peer = new Peer(roomCode);

            peer.on('open', (id) => {
                myPeerId = id;
                lobbyCodeText.innerText = `Code du salon : ${id}`;
                launchRaceBtn.style.display = 'inline-block';
                updateLobbyCount();
            });

            peer.on('connection', (conn) => {
                hostConnections.set(conn.peer, conn);
                conn.on('open', () => {
                    updateLobbyCount();
                });
                conn.on('data', (data) => handleIncomingData(data, conn.peer));
                conn.on('close', () => {
                    hostConnections.delete(conn.peer);
                    removeRemotePlayer(conn.peer);
                    updateLobbyCount();
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id' && attemptsLeft > 0) {
                    // Code déjà pris par quelqu'un d'autre : on réessaie avec un nouveau code
                    peer.destroy();
                    createRoom(attemptsLeft - 1);
                    return;
                }
                console.error('Erreur PeerJS (hôte):', err);
                lobbyCodeText.innerText = 'Erreur de connexion, réessaie.';
            });
        }

        document.getElementById('create-room-btn').addEventListener('click', () => {
            isHost = true;
            lobbyCodeText.innerText = 'Création du salon...';
            showLobby();
            createRoom(5);
        });

        launchRaceBtn.addEventListener('click', () => {
            hostConnections.forEach((conn) => conn.send({ type: 'start' }));
            startGame();
        });

        // --- REJOINDRE UN SALON (invité) ---
        document.getElementById('join-room-btn').addEventListener('click', () => {
            mpChoiceEl.style.display = 'none';
            joinFormEl.style.display = 'flex';
        });

        document.getElementById('confirm-join-btn').addEventListener('click', () => {
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if (!code) return;

            isHost = false;
            peer = new Peer();

            lobbyCodeText.innerText = `Connexion au salon ${code}...`;
            lobbyWaitText.style.display = 'block';
            launchRaceBtn.style.display = 'none';
            showLobby();

            peer.on('open', (id) => {
                myPeerId = id;
                hostConnection = peer.connect(code);

                hostConnection.on('open', () => {
                    lobbyCodeText.innerText = `Connecté au salon ${code}`;
                });
                hostConnection.on('data', (data) => handleIncomingData(data, code));
                hostConnection.on('close', () => {
                    lobbyCodeText.innerText = 'Connexion à l\'hôte perdue.';
                });
                hostConnection.on('error', (err) => {
                    console.error('Erreur de connexion:', err);
                    lobbyCodeText.innerText = 'Impossible de rejoindre ce salon.';
                });
            });

            peer.on('error', (err) => {
                console.error('Erreur PeerJS (invité):', err);
                lobbyCodeText.innerText = 'Erreur de connexion, réessaie.';
            });
        });

        // Envoie régulièrement notre position aux autres joueurs de la partie
        setInterval(() => {
            if (!gameStarted || !myPeerId) return;
            const msg = { type: 'pos', id: myPeerId, x: player.x, y: player.y, z: player.z, rotY: player.facingAngle };
            if (isHost) {
                hostConnections.forEach((conn) => conn.send(msg));
            } else if (hostConnection && hostConnection.open) {
                hostConnection.send(msg);
            }
        }, 100);

        // --- BOUCLE DE JEU & PHYSIQUE ---
        function updatePhysics() {
            if (!gameStarted || !playerMesh) return;

            let moveX = joystickMove.x;
            let moveZ = joystickMove.y;

            if (keys.forward) moveZ = -1;
            if (keys.backward) moveZ = 1;
            if (keys.left) moveX = -1;
            if (keys.right) moveX = 1;

            // Convertit l'input (avancer/reculer/gauche/droite) en mouvement
            // relatif à la direction actuelle de la caméra, pour qu'avancer
            // avance bien dans la direction regardée, même après rotation.
            const forwardAmount = -moveZ; // +1 = avancer
            const sinYaw = Math.sin(cameraYaw);
            const cosYaw = Math.cos(cameraYaw);

            const worldMoveX = forwardAmount * (-sinYaw) + moveX * cosYaw;
            const worldMoveZ = forwardAmount * (-cosYaw) + moveX * (-sinYaw);

            player.vx = worldMoveX * player.speed + player.dashVx;
            player.vz = worldMoveZ * player.speed + player.dashVz;

            player.dashVx *= 0.92;
            player.dashVz *= 0.92;
            if (Math.abs(player.dashVx) < 0.01) player.dashVx = 0;
            if (Math.abs(player.dashVz) < 0.01) player.dashVz = 0;

            player.x += player.vx;
            player.z += player.vz;

            player.vy -= 0.012;
            player.y += player.vy;

            player.isGrounded = false;
            platforms.forEach(p => {
                const b = p.bounds;
                if (Math.abs(player.x - b.x) < b.w / 2 && Math.abs(player.z - b.z) < b.d / 2) {
                    if (player.y <= b.y + 0.5 && player.y >= b.y - 0.2 && player.vy <= 0) {
                        player.y = b.y + 0.5;
                        player.vy = 0;
                        player.isGrounded = true;
                        player.hasDashed = false;
                    }
                }
            });

            // Collision avec le mesh de la map GLB (raycast vers le bas)
            if (mapMesh && player.vy <= 0) {
                groundRaycaster.set(
                    new THREE.Vector3(player.x, player.y + 3, player.z),
                    DOWN_VECTOR
                );
                const hits = groundRaycaster.intersectObject(mapMesh, true);
                if (hits.length > 0) {
                    const groundY = hits[0].point.y;
                    if (player.y <= groundY + 0.6) {
                        player.y = groundY + 0.5;
                        player.vy = 0;
                        player.isGrounded = true;
                        player.hasDashed = false;
                    }
                }
            }

            // (Ancien système de "mort en tombant" retiré : le joueur peut
            // maintenant tomber librement sans être téléporté.)

            checkpoints.forEach((cp, idx) => {
                const dist = Math.hypot(player.x - cp.x, player.z - cp.z);
                if (dist < 1.5 && player.checkpointIndex <= idx) {
                    player.checkpointIndex = idx + 1;
                    document.getElementById('score-hud').innerText = `Checkpoint : ${player.checkpointIndex} / ${checkpoints.length}`;
                    if (cp.isFinish && !raceFinished) {
                        raceFinished = true;
                        document.getElementById('score-hud').innerText = `🏁 Course terminée !`;
                    }
                }
            });

            playerMesh.position.set(player.x, player.y, player.z);
            if (Math.abs(player.vx) > 0.01 || Math.abs(player.vz) > 0.01) {
                playerMesh.rotation.y = Math.atan2(player.vx, player.vz);
                player.facingAngle = playerMesh.rotation.y;
            }

            hazards.forEach(h => {
                h.pivot.rotation.y += h.speed;
            });

            // Affiche la position des autres joueurs connectés (multijoueur)
            remotePlayers.forEach(entry => {
                if (entry.mesh) {
                    entry.mesh.position.set(entry.x, entry.y, entry.z);
                    entry.mesh.rotation.y = entry.rotY;
                }
            });

            bots.forEach(bot => {
                bot.z -= bot.speed;
                bot.mesh.position.set(bot.x, bot.y, bot.z);
                if (bot.z < -145) bot.z = 5;
            });

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].mesh.position.x += bullets[i].vx;
                bullets[i].mesh.position.z += bullets[i].vz;
                bullets[i].life++;
                if (bullets[i].life > 200) {
                    scene.remove(bullets[i].mesh);
                    bullets.splice(i, 1);
                }
            }

            const camX = player.x + Math.sin(cameraYaw) * Math.cos(cameraPitch) * CAMERA_DISTANCE;
            const camZ = player.z + Math.cos(cameraYaw) * Math.cos(cameraPitch) * CAMERA_DISTANCE;
            const camY = player.y + Math.sin(cameraPitch) * CAMERA_DISTANCE;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(player.x, player.y + 1, player.z);
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
